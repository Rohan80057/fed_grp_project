<!DOCTYPE html>
<html>
<head>
  <title>My First Web Page</title>
  <style>
    body {
      background-color: #fefefe;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 60px;
      color: #333;
    }

    h1 {
      color: #007acc;
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #555;
    }

    button {
      background-color: #ff6f61;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #e65b50;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Web Page</h1>
  <p>This is a simple HTML page for beginners.</p>
  <button onclick="alert('Hello! Thanks for clicking.')">Click Me</button>

</body>
</html>
